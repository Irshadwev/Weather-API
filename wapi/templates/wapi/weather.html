{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'wapi/css/weather.css' %}">
</head>

<body>

    <main class="weather-container">

        <section class="weather-card">

            <h1>Weather App</h1>

            <p class="subtitle">
                Check current weather information for any city
            </p>

            <!-- Search -->
            <form id="weather-form">

                <div class="search-box">

                    <input
                        type="text"
                        id="city-input"
                        name="city"
                        placeholder="Enter city name"
                        autocomplete="off"
                        required
                    >

                    <button type="submit">
                        Search
                    </button>

                </div>

            </form>

            <!-- Loading -->
            <div id="loading" class="loading hidden">
                Loading weather...
            </div>

            <!-- Error -->
            <div id="error-message" class="error hidden"></div>

            <!-- Weather Result -->
            <section id="weather-result" class="weather-result hidden">

                <div class="location">
                    <h2 id="city-name">--</h2>
                    <p id="weather-description">--</p>
                </div>

                <div class="temperature">
                    <span id="temperature">--</span>
                    <span>°C</span>
                </div>

                <div class="weather-details">

                    <div class="weather-detail">
                        <span class="label">Feels Like</span>
                        <span id="feels-like">--</span>
                    </div>

                    <div class="weather-detail">
                        <span class="label">Humidity</span>
                        <span id="humidity">--</span>
                    </div>

                    <div class="weather-detail">
                        <span class="label">Wind Speed</span>
                        <span id="wind-speed">--</span>
                    </div>

                    <div class="weather-detail">
                        <span class="label">Pressure</span>
                        <span id="pressure">--</span>
                    </div>

                </div>

                <!-- Data source -->
                <p class="source">
                    Data source:
                    <span id="data-source">--</span>
                </p>

            </section>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="{% static 'wapi/js/weather.js' %}"></script>

</body>
</html>
